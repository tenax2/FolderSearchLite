<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folder Search Lite</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("folder-search-lite-theme");
        document.documentElement.dataset.theme = savedTheme === "black" ? "black" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- アプリ全体は、固定ヘッダーと選択中パネルの2行グリッドで構成する。 -->
    <main class="app-shell">
      <!-- ヘッダーはアプリ名、処理状態、検索・履歴・ブックマークのタブを保持する。 -->
      <header class="topbar">
        <div>
          <h1>Folder Search Lite</h1>
          <p id="statusText" class="status-text">待機中</p>
        </div>
        <div class="topbar-actions">
          <div class="theme-switch" role="group" aria-label="画面テーマ">
            <button class="theme-option" type="button" data-theme-option="light" aria-pressed="true">ライト</button>
            <button class="theme-option" type="button" data-theme-option="black" aria-pressed="false">ブラック</button>
          </div>
          <nav class="tabs" role="tablist" aria-label="ビュー">
            <button id="searchTab" class="tab-button active" type="button" role="tab" aria-selected="true" aria-controls="searchPanel" data-tab="search">検索</button>
            <button id="historyTab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="historyPanel" data-tab="history">履歴</button>
            <button id="bookmarksTab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="bookmarksPanel" data-tab="bookmarks">ブックマーク</button>
          </nav>
        </div>
      </header>

      <!-- 検索パネルは、検索条件、走査統計、結果グリッドを上から順に配置する。 -->
      <section id="searchPanel" class="panel active" role="tabpanel" aria-labelledby="searchTab">
        <!-- 送信時に各入力をSearchRequestへ変換する。ブラウザーの通常送信はmain.jsが抑止する。 -->
        <form id="searchForm" class="search-form">
          <!-- 検索ルートは手入力とOS標準フォルダ選択の両方に対応する。 -->
          <label class="field path-field">
            <span>フォルダ</span>
            <div class="input-row">
              <input id="rootPath" name="rootPath" type="text" autocomplete="off" placeholder="C:\Projects\sample" />
              <button id="browseButton" class="secondary" type="button">参照</button>
            </div>
          </label>

          <label class="field query-field">
            <span>文字列</span>
            <input id="query" name="query" type="text" autocomplete="off" placeholder="検索語" />
          </label>

          <label class="field extensions-field">
            <span>拡張子</span>
            <input id="extensions" name="extensions" type="text" autocomplete="off" placeholder=".go, .txt" />
          </label>

          <!-- 検索対象と照合方法を指定するフラグ群。名前検索はファイルとフォルダで独立する。 -->
          <div class="controls">
            <label><input id="includeFileNames" type="checkbox" checked />ファイル名</label>
            <label><input id="includeFolderNames" type="checkbox" checked />フォルダ名</label>
            <label><input id="includeContents" type="checkbox" />内容</label>
            <label><input id="includeOfficeDocuments" type="checkbox" checked />Office文書</label>
            <label><input id="caseSensitive" type="checkbox" />大小区別</label>
          </div>

          <label class="field compact max-results-field">
            <span>上限</span>
            <input id="maxResults" type="number" min="1" max="5000" value="500" />
          </label>

          <!-- 検索中はmain.jsが検索・参照を無効化し、中断だけを有効化する。 -->
          <div class="actions">
            <button id="searchButton" type="submit">検索</button>
            <button id="cancelSearchButton" class="secondary" type="button" disabled>中断</button>
            <button id="bookmarkCurrentButton" class="secondary" type="button" disabled>保存</button>
          </div>

          <!-- よく使う検索ルートを永続化し、フォルダーダイアログを開かずに再選択できるようにする。 -->
          <div class="favorite-folders">
            <label class="favorite-folder-label" for="favoriteFolderSelect">お気に入りフォルダー</label>
            <select id="favoriteFolderSelect" aria-describedby="favoriteFolderHelp">
              <option value="">登録なし</option>
            </select>
            <button id="addFavoriteFolderButton" class="secondary" type="button" disabled>現在のフォルダーを登録</button>
            <button id="removeFavoriteFolderButton" class="secondary danger" type="button" disabled>解除</button>
            <span id="favoriteFolderHelp" class="field-help">選択すると検索対象のフォルダーへ反映します。</span>
          </div>

          <!-- 使用頻度の低い除外条件は、必要なときだけ展開できる詳細領域へまとめる。 -->
          <details id="advancedSearch" class="advanced-search">
            <summary>詳細な検索条件</summary>
            <div class="advanced-fields">
              <label class="field">
                <span>除外するファイル名</span>
                <input id="excludedFileNames" name="excludedFileNames" type="text" autocomplete="off" placeholder="Thumbs.db, .DS_Store" />
                <span class="field-help">カンマまたはセミコロンで区切って指定します。完全一致で、大小文字は区別しません。</span>
              </label>

              <label class="field">
                <span>除外する拡張子</span>
                <input id="excludedExtensions" name="excludedExtensions" type="text" autocomplete="off" placeholder=".tmp, .log, bak" />
                <span class="field-help">カンマ、空白、セミコロンで区切って指定します。先頭のピリオドは省略できます。</span>
              </label>
            </div>
          </details>
        </form>

        <!-- 左側は表示件数、右側はバックエンドが返す走査対象数を表示する。 -->
        <div class="summary-row">
          <span id="resultSummary">0 件</span>
          <span id="scanSummary">0 item</span>
        </div>

        <!-- 結果グリッドは領域内でスクロールし、ヘッダーと列フィルターを上端へ固定する。 -->
        <div class="table-wrap">
          <table>
            <thead>
              <!-- 見出しボタンは昇順・降順を切り替え、aria-sortもmain.jsが同期する。 -->
              <tr>
                <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="kind">種別<span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="name">名前<span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="relativePath">相対パス<span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="matchedBy">一致<span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="size">サイズ<span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th scope="col" aria-sort="none"><button class="sort-button" type="button" data-sort="modifiedAt">更新<span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th scope="col"><span class="visually-hidden">操作</span></th>
              </tr>
              <!-- フィルターは元の検索結果を変更せず、画面へ表示する行だけを絞り込む。 -->
              <tr class="filter-row">
                <th>
                  <label class="visually-hidden" for="kindFilter">種別で絞り込み</label>
                  <select id="kindFilter" class="column-filter" data-filter="kind">
                    <option value="">すべて</option>
                    <option value="file">ファイル</option>
                    <option value="folder">フォルダ</option>
                  </select>
                </th>
                <th><label class="visually-hidden" for="nameFilter">名前で絞り込み</label><input id="nameFilter" class="column-filter" type="search" data-filter="name" placeholder="絞り込み" /></th>
                <th><label class="visually-hidden" for="pathFilter">相対パスで絞り込み</label><input id="pathFilter" class="column-filter" type="search" data-filter="relativePath" placeholder="絞り込み" /></th>
                <th>
                  <label class="visually-hidden" for="matchFilter">一致箇所で絞り込み</label>
                  <select id="matchFilter" class="column-filter" data-filter="matchedBy">
                    <option value="">すべて</option>
                    <option value="extension">拡張子</option>
                    <option value="file-name">ファイル名</option>
                    <option value="folder-name">フォルダ名</option>
                    <option value="content">内容</option>
                  </select>
                </th>
                <th><label class="visually-hidden" for="sizeFilter">サイズで絞り込み</label><input id="sizeFilter" class="column-filter" type="search" data-filter="size" placeholder="例: &gt;= 1 MB" /></th>
                <th><label class="visually-hidden" for="modifiedFilter">更新日時で絞り込み</label><input id="modifiedFilter" class="column-filter" type="search" data-filter="modifiedAt" placeholder="日付・時刻" /></th>
                <th><button id="clearFiltersButton" class="secondary clear-filters" type="button" disabled>解除</button></th>
              </tr>
            </thead>
            <!-- 検索結果行はエスケープ済み文字列からmain.jsが動的に生成する。 -->
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>

      <!-- 履歴パネルは、過去の検索条件の再実行、保存、全削除を提供する。 -->
      <section id="historyPanel" class="panel" role="tabpanel" aria-labelledby="historyTab">
        <div class="section-toolbar">
          <h2>履歴</h2>
          <button id="clearHistoryButton" class="secondary danger" type="button">クリア</button>
        </div>
        <div id="historyList" class="saved-list"></div>
      </section>

      <!-- ブックマークパネルは、保存した検索条件の再実行と解除を提供する。 -->
      <section id="bookmarksPanel" class="panel" role="tabpanel" aria-labelledby="bookmarksTab">
        <div class="section-toolbar">
          <h2>ブックマーク</h2>
        </div>
        <div id="bookmarkList" class="saved-list"></div>
      </section>
    </main>

    <!-- 内容一致した結果だけが、一覧から詳細プレビューを開ける。 -->
    <dialog id="previewDialog" class="preview-dialog" aria-labelledby="previewTitle">
      <div class="preview-dialog-shell">
        <header class="preview-header">
          <div class="preview-heading">
            <span class="preview-eyebrow">内容プレビュー</span>
            <h2 id="previewTitle">ファイル</h2>
          </div>
          <button id="closePreviewButton" class="secondary" type="button">閉じる</button>
        </header>
        <p id="previewPath" class="preview-path"></p>
        <div id="previewContent" class="preview-content" aria-live="polite"></div>
      </div>
    </dialog>

    <!-- DOM構築後にイベント登録と保存済み一覧の初期取得を実行する。 -->
    <script src="./main.js"></script>
  </body>
</html>
